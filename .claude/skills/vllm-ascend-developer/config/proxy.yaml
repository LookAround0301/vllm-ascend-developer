# ============================================================================
# proxy.yaml — 网络代理配置
# ============================================================================
# 用于 pip 安装依赖、git clone 源码等需要公网访问的场景。
# 使用时根据实际环境修改 ip 和 port 两个字段。
#
# ===== 可配字段 =====
#   ip:    代理服务器 IP
#   port:  代理端口
#
# ===== 代理指令（模块读取 ip + port 后按以下模板生成） =====
#   export http_proxy="http://p_atlas:proxy%40123@{ip}:{port}"
#   export https_proxy="http://p_atlas:proxy%40123@{ip}:{port}"
#   export no_proxy=127.0.0.1,.huawei.com,localhost,local,.local
#   export GIT_SSL_NO_VERIFY=1
# ============================================================================

ip: "90.253.93.128"                                                         # 代理服务器 IP
port: 8080                                                               # 代理端口
