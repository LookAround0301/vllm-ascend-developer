# ============================================================================
# test.yaml — 测试用例配置
# ============================================================================
# 使用前请根据实际环境修改对应字段
#
# ===== 全局配置 =====
#   output_log:     测试输出日志存放路径
#   timeout:        默认超时时间（秒），单条测试可覆盖
#
# ===== 测试用例字段说明 =====
#   name:            测试名称（用于识别）
#   endpoint:        推理请求端点
#                      Chat 模式: http://<ip>:<port>/v1/chat/completions
#                      Base 模式: http://localhost:<port>/v1/completions
#   params:          请求参数
#     max_tokens:      最大输出 token 数
#     temperature:     采样温度
#     top_p:           nucleus sampling
#     top_k:           top-k sampling
#     repetition_penalty: 重复惩罚
#     stream:          是否流式返回
#     seed:            随机种子
#   prompts:         测试 prompt 列表（每条 prompt 独立发起一次请求）
#   expected_output: 预期输出内容
#   comparison_mode: 比较方式: "exact" | "contains" | "regex"
#   timeout:         超时时间（秒），不填则使用全局默认值
# ============================================================================

# 全局配置
output_log: "/home/user/workspace/curl_test.log"                                           # 输出日志路径
timeout: 60                                                             # 默认超时（秒）

# 测试用例列表
tests:
  - name: "base-model-test"                                             # 测试名称
    endpoint: "http://<ip>:<port>/v1/completions"                       # 请求端点
    params:                                                             # 请求参数
      model: "deepseek"
      max_tokens: 10
      temperature: 0
